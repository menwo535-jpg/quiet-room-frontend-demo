ght:590px}.switch button{padding:8px 10px}.cards{grid-template-columns:1fr}.discover h1{font-size:31px}.footer{align-items:flex-start;gap:15px;line-height:1.7}.footer span{letter-spacing:0}.chat-head{padding:18px 20px}.message{max-width:93%}.composer-foot{font-size:9px}}

<body><div class="shell"><aside class="rail"><div class="brand">◒</div><button id="nav-chat" aria-pressed="true">此刻</button><button id="nav-discover" aria-pressed="false">遇见</button><div class="bottom">给生活，留一点白</div></aside><main class="workspace"><header class="top"><div><div class="wordmark">留白</div><div class="eyebrow">A LITTLE ROOM FOR YOU</div></div><div class="switch" aria-label="场景风格"><button id="warm" aria-pressed="true">雨日书房</button><button id="cool" aria-pressed="false">午夜电台</button></div></header>
<div class="layout" id="chat-view"><section class="story" aria-label="场景插画"><svg class="art" viewBox="0 0 460 690" preserveAspectRatio="xMidYMid slice" role="img" aria-label="雨夜窗边的灯光、书本与远处的城市"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d7ce9c"/><stop offset=".62" stop-color="#749583"/><stop offset="1" stop-color="#365449"/></linearGradient><linearGradient id="glow"><stop stop-color="#dfbe73"/><stop offset="1" stop-color="#dfbe7300"/></linearGradient><pattern id="rain" width="31" height="73" patternUnits="userSpaceOnUse"><path d="M15 0L8 28 M29 43L23 65" stroke="#f4f4d3" stroke-opacity=".25" stroke-width="1"/></pattern></defs><rect width="460" height="690" fill="#526b51"/><rect x="45" y="-15" width="380" height="530" rx="180" fill="url(#sky)"/><circle cx="290" cy="156" r="58" fill="#eddea7" opacity=".5"/><path d="M45 330h55v-92h36v115h25V212h53v129h25V280h60v65h23V242h34v80h65v190H45z" fill="#496f63"/><path d="M45 385h45v-76h65v101h55v-89h30v54h68v-43h45v46h72v134H45z" fill="#34564e"/><g fill="#b5c08e" opacity=".55"><path d="M110 256h5v12h-5zM110 279h5v12h-5zM177 235h8v6h-8zM193 235h8v6h-8zM177 250h8v6h-8zM193 250h8v6h-8zM331 264h7v12h-7zM331 289h7v12h-7z"/></g><rect x="45" width="380" height="512" fill="url(#rain)"/><path d="M43 160H425M43 315H425M237 0V518" stroke="#283d31" stroke-width="11"/><path d="M39 505h389v20H39z" fill="#273e30"/><path d="M0 558L460 518v172H0z" fill="#3d4c35"/><path d="M326 420l55 89H270z" fill="#d5bd79"/><path d="M326 503v45m-26 0h52" stroke="#a59562" stroke-width="5"/><path d="M270 508L177 554l210-7-7-39" fill="url(#glow)" opacity=".4"/><path d="M104 517l67-6 38 22-65 8z" fill="#aeb08a"/><path d="M103 522l40 24 67-9v-6l-67 8-40-23z" fill="#ddd2a5"/><path d="M120 533l66 1 23 21-65 1z" fill="#817e50"/><path d="M369 348q-38-12-33-66 41 6 33 66m0 0q36-32 48-7-9 39-48 26m-3-2q-38-3-33 25 34 15 34 1" fill="#244937"/><path d="M365 323l4 112" stroke="#284a35" stroke-width="4"/><path d="M345 425h49l-8 56h-31z" fill="#a8a879"/></svg><div class="story-top"><span class="tag" id="scene-tag">慢下来的一刻</span><span class="edition">01</span></div><div class="story-content"><div class="tiny" id="story-kicker">THE QUIET BETWEEN RAINDROPS</div><h1 id="story-title">雨停之前<br>聊一会儿。</h1><p id="story-copy">窗外的世界还在赶路。<br>这里，有一盏为你留着的灯。</p><div class="divider"></div><div class="person"><div class="avatar">序</div><div><strong id="person-name">林序</strong><small id="person-desc">旧书店主理人 · 善于听你说</small></div><span class="arrow">↗</span></div></div></section>

<section class="discover" id="discover-view"><div class="eyebrow">MEET SOMEONE, FIND YOUR MOMENT</div><h1>在不同的故事里，<br>遇见此刻的自己。</h1><p>一个安静的角落，一段刚刚好的对话。</p><div class="cards"><button class="card" id="card-warm"><small>01 / 雨日书房</small><b>雨停之前</b><em>林序 · 一家旧书店，一盏不急着熄灭的灯。<br>进入场景 ↗</em></button><button class="card" id="card-cool"><small>02 / 午夜电台</small><b>城市慢半拍</b><em>陈屿 · 把今天没说完的话，留给夜色。<br>进入场景 ↗</em></button></div></section>

<script>
const $=id=>document.getElementById(id);let night=false;let pending=null;
function addMessage(text,user=false){const item=document.createElement('div');item.className='message'+(user?' user':'');const name=document.createElement('div');name.className='name';name.textContent=user?'你':night?'陈屿':'林序';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;item.append(name,bubble);$('messages').append(item);$('messages').scrollTop=$('messages').scrollHeight}
function reset(){clearTimeout(pending);pending=null;$('messages').replaceChildren();const time=document.createElement('div');time.className='time';time.textContent=night?'00:24 · 城市慢半拍':'18:42 · 雨还没有停';const narration=document.createElement('p');narration.className='narration';narration.textContent=night?'「电台里的音乐渐渐轻了，窗外还有几扇亮着的窗。」':'「他把手边的书轻轻合上，往窗边挪了挪杯子。」';$('messages').append(time,narration);addMessage(night?'晚上好。今天的城市终于安静下来了。\n有什么想说的，或者只是想坐一会儿？':'你来得刚好，水才烧开。\n外面的雨挺大吧？先坐，不用急着说什么。');$('message-input').value='';$('send').disabled=true}
function send(text){text=text.trim();if(!text||pending)return;addMessage(text,true);$('message-input').value='';$('send').disabled=true;pending=setTimeout(()=>{pending=null;let answer;if(/累|难|烦/.test(text))answer='那就先把今天放一放。\n不用马上振作，也不用急着整理好心情。要不要说说，今天最消耗你的那一件事？';else if(/书/.test(text))answer='想起《小王子》里那些关于相遇的片刻。\n你更想读一个温柔的故事，还是一本能让你暂时忘记时间的书？';else if(/故事/.test(text))answer='有家小书店，门口一直放着一把没人的椅子。\n店主说，不是没人来，只是给路过的人留一个“可以停下来”的理由。';else answer=night?'我在听。\n如果把这一刻变成电台里的一首歌，你会给它取什么名字？':'嗯，我在听。\n你可以慢慢说，我们今晚还有很多时间。';addMessage(answer);$('send').disabled=!$('message-input').value.trim()},650)}
function view(discover){$('chat-view').style.display=discover?'none':'';$('discover-view').classList.toggle('open',discover);$('nav-chat').setAttribute('aria-pressed',!discover);$('nav-discover').setAttribute('aria-pressed',discover);$('explore').textContent=discover?'回到此刻 ↗':'看看其他相遇 ↗'}
function theme(value){night=value;document.body.classList.toggle('night',night);$('warm').setAttribute('aria-pressed',!night);$('cool').setAttribute('aria-pressed',night);$('story-title').replaceChildren();const line1=document.createTextNode(night?'城市慢半拍，':'雨停之前');const br=document.createElement('br');$('story-title').append(line1,br,document.createTextNode(night?'你也是。':'聊一会儿。'));$('story-copy').textContent=night?'夜色会接住那些，白天没来得及说的话。':'窗外的世界还在赶路。这里，有一盏为你留着的灯。';$('person-name').textContent=night?'陈屿':'林序';$('person-desc').textContent=night?'午夜电台主播 · 收藏城市的声音':'旧书店主理人 · 善于听你说';$('chat-name').textContent=night?'与陈屿的夜话':'与林序的片刻';$('scene-tag').textContent=night?'晚安之前的一刻':'慢下来的一刻';$('story-kicker').textContent=night?'A FREQUENCY JUST FOR TONIGHT':'THE QUIET BETWEEN RAINDROPS';document.querySelector('.avatar').textContent=night?'屿':'序';document.querySelector('.edition').textContent=night?'02':'01';document.title=night?'留白 — 城市慢半拍':'留白 — 雨停之前';reset()}
$('composer').addEventListener('submit',e=>{e.preventDefault();send($('message-input').value)});$('message-input').addEventListener('input',()=>{$('send').disabled=!!pending||!$('message-input').value.trim()});$('message-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($('message-input').value)}});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.prompt)));$('restart').onclick=reset;$('warm').onclick=()=>theme(false);$('cool').onclick=()=>theme(true);$('nav-chat').onclick=()=>view(false);$('nav-discover').onclick=()=>view(true);$('explore').onclick=()=>view(!$('discover-view').classList.contains('open'));$('card-warm').onclick=()=>{theme(false);view(false)};$('card-cool').onclick=()=>{theme(true);view(false)};reset();
</script></body></html>
